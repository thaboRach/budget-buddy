<nav class="side-bar" id="primary-navigation">
  <button
    type="button"
    class="close-btn"
    aria-label="Close navigation menu"
    (click)="closeRequested.emit()"
  >
    <svg app-icon name="close" class="close-icon" width="28" height="28"></svg>
  </button>

  <section class="logo-container">
    <svg app-icon name="logo" class="logo" width="32" height="32"></svg>
    <h1 class="title">BudgetBuddy</h1>
  </section>

  <ul class="nav-items">
    @for (item of sideBarItems; track $index) {
      <li>
        <a (click)="closeRequested.emit()" [routerLink]="item.path">
          <span>{{ item.title }}</span>
          <svg app-icon name="chevron-right" class="icon"></svg>
        </a>
      </li>
    }
  </ul>

  <section class="user-account">
    <img src="https://i.pravatar.cc/150?u=testUser" alt="User avatar" width="32" />
    <p class="user-name">{{ fullName() }}</p>
  </section>
</nav>
