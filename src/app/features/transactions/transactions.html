<main class="main-layout">
  <h2 class="heading">Transactions</h2>

  <a matButton="filled" [routerLink]="'/transactions/new'" class="transactions-button"
    >Add Transaction</a
  >

  @if (saveError(); as error) {
    <p class="transactions-error" role="alert">{{ error }}</p>
  }

  <app-table
    [data]="transactions()"
    [columns]="columns"
    [editingConfig]="editingConfig"
    (rowValueChanged)="onTransactionChanged($event)"
  ></app-table>
</main>
