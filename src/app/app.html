<header class="mobile-header">
  <button
    type="button"
    class="hamburger-btn"
    [attr.aria-expanded]="sidebarOpen()"
    aria-controls="primary-navigation"
    [attr.aria-label]="sidebarOpen() ? 'Close navigation menu' : 'Open navigation menu'"
    (click)="sidebarOpen.update((open) => !open)"
  >
    <svg app-icon name="menu" width="24" height="24"></svg>
  </button>
  <svg app-icon name="logo" class="logo" width="32" height="32"></svg>
  <span class="app-title">BudgetBuddy</span>
</header>

@if (sidebarOpen()) {
  <button
    class="sidebar-backdrop"
    type="button"
    aria-label="Close navigation menu"
    (click)="closeSidebar()"
  ></button>
}

<app-side-bar
  [class.is-open]="sidebarOpen()"
  (closeRequested)="closeSidebar()"
  fullName="Test User"
></app-side-bar>

<div class="main-content">
  <router-outlet></router-outlet>
</div>
